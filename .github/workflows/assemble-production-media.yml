name: Assemble production media

on:
  push:
    paths:
      - "staging/READY"

permissions:
  contents: write

concurrency:
  group: p0ndenush-media-assembler
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assemble exact feed and Story JPEGs
        run: |
          mkdir -p instagram
          cat staging/feed.*.b64 | tr -d '\n\r ' | base64 --decode > instagram/2026-10-01-high-fps-low-latency-production-v1.jpg
          cat staging/story.*.b64 | tr -d '\n\r ' | base64 --decode > instagram/2026-10-01-high-fps-low-latency-story-v1.jpg

      - name: Verify production media
        run: |
          python - <<'PY'
          from PIL import Image
          expected = {
              'instagram/2026-10-01-high-fps-low-latency-production-v1.jpg': (1080, 1350),
              'instagram/2026-10-01-high-fps-low-latency-story-v1.jpg': (1080, 1920),
          }
          for path, size in expected.items():
              im = Image.open(path)
              assert im.format == 'JPEG', (path, im.format)
              assert im.mode == 'RGB', (path, im.mode)
              assert im.size == size, (path, im.size)
              assert not (im.info.get('progressive') or im.info.get('progression')), path
              im.verify()
              print(path, 'OK', size)
          PY

      - name: Commit exact production media
        run: |
          git config user.name "p0NDENUSH Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/2026-10-01-high-fps-low-latency-production-v1.jpg instagram/2026-10-01-high-fps-low-latency-story-v1.jpg
          git rm -r staging
          git commit -m "Assemble exact approved production media"
          git pull --rebase origin main
          git push
