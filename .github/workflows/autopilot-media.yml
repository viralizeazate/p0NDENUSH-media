name: Autopilot media factory

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_autopilot_assets.py"
      - "external_media_tick.txt"
      - ".github/workflows/autopilot-media.yml"
  schedule:
    # Keep GitHub cron as best-effort. External scheduler heartbeats can also
    # trigger this workflow through external_media_tick.txt when schedule events
    # are delayed or dropped.
    - cron: "13 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: p0ndenush-media-autopilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0

      - name: Generate rolling 14-day visual buffer
        run: python scripts/generate_autopilot_assets.py --days 14

      - name: Verify generated media
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          manifest = json.loads(Path('instagram/autopilot/manifest.json').read_text(encoding='utf-8'))
          assets = manifest.get('assets', [])
          assert len(assets) == 14, f"expected 14 asset pairs, got {len(assets)}"
          for row in assets:
              for key, expected in [('feed', (1080, 1350)), ('story', (1080, 1920))]:
                  p = Path(row[key])
                  assert p.exists(), p
                  with Image.open(p) as im:
                      assert im.format == 'JPEG', (p, im.format)
                      assert im.mode == 'RGB', (p, im.mode)
                      assert im.size == expected, (p, im.size)
          print(f"Verified {len(assets) * 2} production JPEGs")
          PY

      - name: Commit generated buffer
        run: |
          if [ -z "$(git status --porcelain -- instagram/autopilot)" ]; then
            echo "Visual buffer already current."
            exit 0
          fi
          git config user.name "p0NDENUSH Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/autopilot
          git commit -m "Refresh autopilot media buffer"
          git pull --rebase origin main
          git push
